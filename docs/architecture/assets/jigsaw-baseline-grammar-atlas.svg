<title id="title">Puzzle Forge Jigsaw baseline grammar atlas</title>
<desc id="desc">Seven baseline grammars shown from the quiet identity case through increasingly expressive continuations. Geometry is rendered from the baseline grammar definitions with the production corner-safety envelope.</desc>
