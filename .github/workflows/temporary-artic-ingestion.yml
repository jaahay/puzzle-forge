name: Temporary Art Institute ingestion

on:
  push:
    branches:
      - feat/artic-artwork-provider
    paths:
      - scripts/ingest_jigsaw_images.py
      - assets/jigsaw/sources.json
      - .github/workflows/temporary-artic-ingestion.yml

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/artic-artwork-provider
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install "Pillow==12.3.0"
      - name: Verify Met and Art Institute providers
        run: |
          python scripts/ingest_jigsaw_images.py \
            wheat-field-cypresses \
            la-grande-jatte \
            childs-bath \
            american-gothic \
            coronation-stone-motecuhzoma \
            embroidered-picture \
            first-of-the-herring \
            --verify-only
      - name: Ingest Art Institute batch
        run: |
          python scripts/ingest_jigsaw_images.py \
            la-grande-jatte \
            childs-bath \
            american-gothic \
            coronation-stone-motecuhzoma \
            embroidered-picture \
            first-of-the-herring
      - name: Commit generated assets
        run: |
          git add assets/jigsaw public/jigsaw
          if git diff --cached --quiet; then
            echo "No generated artwork changes found." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Ingest Art Institute artwork batch"
          git push origin HEAD:feat/artic-artwork-provider
