name: Temporary artwork ingestion

on:
  push:
    branches:
      - feat/expand-artwork-gallery
    paths:
      - assets/jigsaw/sources.json
      - .github/workflows/temporary-artwork-ingestion.yml

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/expand-artwork-gallery
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install "Pillow==12.3.0"
      - name: Verify and ingest new artwork
        run: |
          python scripts/ingest_jigsaw_images.py \
            young-woman-water-pitcher \
            death-of-socrates \
            dancing-class \
            silver-tureen \
            sudden-shower-shin-ohashi \
            musicians \
            unicorn-garden \
            washington-crossing-delaware \
            --verify-only
          python scripts/ingest_jigsaw_images.py \
            young-woman-water-pitcher \
            death-of-socrates \
            dancing-class \
            silver-tureen \
            sudden-shower-shin-ohashi \
            musicians \
            unicorn-garden \
            washington-crossing-delaware
      - name: Commit generated assets
        run: |
          git add assets/jigsaw public/jigsaw
          if git diff --cached --quiet; then
            echo "No generated artwork changes found." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Ingest expanded artwork batch"
          git push origin HEAD:feat/expand-artwork-gallery
