name: Ingest verified Jigsaw artwork

on:
  push:
    branches:
      - codex/jigsaw-first-verified-artwork
    paths:
      - .github/workflows/ingest-jigsaw-artwork.yml

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/jigsaw-first-verified-artwork

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Verify source record and build derivatives
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          from PIL import Image, ImageOps

          object_id = 436535
          record_url = f"https://collectionapi.metmuseum.org/public/collection/v1/objects/{object_id}"

          with urllib.request.urlopen(record_url, timeout=60) as response:
              record = json.load(response)

          expected = {
              "objectID": object_id,
              "title": "Wheat Field with Cypresses",
              "artistDisplayName": "Vincent van Gogh",
              "isPublicDomain": True,
          }
          for field, value in expected.items():
              if record.get(field) != value:
                  raise RuntimeError(f"Unexpected Met record field {field}: {record.get(field)!r}")

          source_image_url = record.get("primaryImage")
          if not source_image_url:
              raise RuntimeError("The verified Met record does not expose a primary image")

          source_dir = Path(".artwork-ingestion")
          public_dir = Path("public/jigsaw/wheat-field-cypresses")
          provenance_dir = Path("assets/jigsaw/wheat-field-cypresses")
          source_dir.mkdir(parents=True, exist_ok=True)
          public_dir.mkdir(parents=True, exist_ok=True)
          provenance_dir.mkdir(parents=True, exist_ok=True)

          source_path = source_dir / "source-image"
          with urllib.request.urlopen(source_image_url, timeout=120) as response:
              source_bytes = response.read()
          source_path.write_bytes(source_bytes)

          source_sha256 = hashlib.sha256(source_bytes).hexdigest()

          with Image.open(source_path) as opened:
              image = ImageOps.exif_transpose(opened).convert("RGB")
              source_width, source_height = image.size

              derivatives = {
                  "puzzle": (2048, 90),
                  "preview": (1024, 86),
                  "thumbnail": (384, 82),
              }
              generated = {}
              for name, (max_dimension, quality) in derivatives.items():
                  derivative = image.copy()
                  derivative.thumbnail((max_dimension, max_dimension), Image.Resampling.LANCZOS)
                  output_path = public_dir / f"{name}.webp"
                  derivative.save(output_path, format="WEBP", quality=quality, method=6)
                  generated[name] = {
                      "path": f"/{output_path.as_posix().removeprefix('public/')}",
                      "width": derivative.width,
                      "height": derivative.height,
                      "sha256": hashlib.sha256(output_path.read_bytes()).hexdigest(),
                  }

          provenance = {
              "schemaVersion": 1,
              "assetId": "wheat-field-cypresses",
              "assetRevision": 1,
              "work": {
                  "title": record["title"],
                  "creator": record["artistDisplayName"],
                  "date": record.get("objectDate"),
                  "medium": record.get("medium"),
                  "dimensions": record.get("dimensions"),
              },
              "source": {
                  "institution": "The Metropolitan Museum of Art",
                  "objectId": object_id,
                  "accessionNumber": record.get("accessionNumber"),
                  "recordUrl": record.get("objectURL"),
                  "apiRecordUrl": record_url,
                  "sourceImageUrl": source_image_url,
                  "sourceImageSha256": source_sha256,
                  "sourceWidth": source_width,
                  "sourceHeight": source_height,
              },
              "rights": {
                  "isPublicDomain": record["isPublicDomain"],
                  "policy": "The Met Open Access",
                  "policyUrl": "https://www.metmuseum.org/hubs/open-access",
                  "verification": "The Met object API returned isPublicDomain=true for object 436535.",
              },
              "derivatives": generated,
              "generatedAt": datetime.now(timezone.utc).isoformat(),
          }
          (provenance_dir / "provenance.json").write_text(
              json.dumps(provenance, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit verified derivatives and provenance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/jigsaw/wheat-field-cypresses assets/jigsaw/wheat-field-cypresses
          git commit -m "Ingest verified Wheat Field with Cypresses derivatives"
          git push origin HEAD:codex/jigsaw-first-verified-artwork
