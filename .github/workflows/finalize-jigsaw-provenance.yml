name: Finalize Jigsaw provenance

on:
  push:
    branches:
      - codex/jigsaw-first-verified-artwork
    paths:
      - .github/workflows/finalize-jigsaw-provenance.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/jigsaw-first-verified-artwork

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --disable-pip-version-check pillow

      - name: Regenerate derivatives and provenance
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import mimetypes
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          import PIL
          from PIL import Image, ImageOps

          object_id = 436535
          record_url = f"https://collectionapi.metmuseum.org/public/collection/v1/objects/{object_id}"
          with urllib.request.urlopen(record_url, timeout=60) as response:
              record = json.load(response)

          expected = {
              "objectID": object_id,
              "title": "Wheat Field with Cypresses",
              "artistDisplayName": "Vincent van Gogh",
              "isPublicDomain": True,
          }
          for field, value in expected.items():
              if record.get(field) != value:
                  raise RuntimeError(f"Unexpected Met record field {field}: {record.get(field)!r}")

          source_image_url = record["primaryImage"]
          request = urllib.request.Request(source_image_url, headers={"User-Agent": "PuzzleForgeAssetIngest/1.0"})
          with urllib.request.urlopen(request, timeout=120) as response:
              source_bytes = response.read()
              source_mime_type = response.headers.get_content_type()

          source_path = Path(".artwork-source")
          source_path.write_bytes(source_bytes)
          public_dir = Path("public/jigsaw/wheat-field-cypresses")
          public_dir.mkdir(parents=True, exist_ok=True)

          derivative_specs = {
              "puzzle": {"maxDimension": 2048, "quality": 90},
              "preview": {"maxDimension": 1024, "quality": 86},
              "thumbnail": {"maxDimension": 384, "quality": 82},
          }

          with Image.open(source_path) as opened:
              image = ImageOps.exif_transpose(opened).convert("RGB")
              source_width, source_height = image.size
              generated = {}
              for name, spec in derivative_specs.items():
                  derivative = image.copy()
                  derivative.thumbnail(
                      (spec["maxDimension"], spec["maxDimension"]),
                      Image.Resampling.LANCZOS,
                  )
                  output_path = public_dir / f"{name}.webp"
                  derivative.save(
                      output_path,
                      format="WEBP",
                      quality=spec["quality"],
                      method=6,
                  )
                  generated[name] = {
                      "path": f"/{output_path.as_posix().removeprefix('public/')}",
                      "width": derivative.width,
                      "height": derivative.height,
                      "byteSize": output_path.stat().st_size,
                      "sha256": hashlib.sha256(output_path.read_bytes()).hexdigest(),
                      "recipe": {
                          "maxDimension": spec["maxDimension"],
                          "resizeMode": "contain",
                          "resampling": "Lanczos",
                          "crop": "none",
                          "outputColorMode": "RGB",
                          "format": "WebP",
                          "quality": spec["quality"],
                          "method": 6,
                      },
                  }

          provenance = {
              "schemaVersion": 1,
              "assetId": "wheat-field-cypresses",
              "assetRevision": 1,
              "work": {
                  "title": record["title"],
                  "creator": record["artistDisplayName"],
                  "date": record.get("objectDate"),
                  "medium": record.get("medium"),
                  "dimensions": record.get("dimensions"),
              },
              "source": {
                  "institution": "The Metropolitan Museum of Art",
                  "objectId": object_id,
                  "accessionNumber": record.get("accessionNumber"),
                  "recordUrl": record.get("objectURL"),
                  "apiRecordUrl": record_url,
                  "sourceImageUrl": source_image_url,
                  "retrievedAt": datetime.now(timezone.utc).isoformat(),
                  "mimeType": source_mime_type or mimetypes.guess_type(source_image_url)[0],
                  "byteSize": len(source_bytes),
                  "sha256": hashlib.sha256(source_bytes).hexdigest(),
                  "width": source_width,
                  "height": source_height,
              },
              "rights": {
                  "isPublicDomain": record["isPublicDomain"],
                  "policy": "The Met Open Access",
                  "policyUrl": "https://www.metmuseum.org/hubs/open-access",
                  "verification": "The Met object API returned isPublicDomain=true for object 436535.",
                  "reviewedAt": datetime.now(timezone.utc).date().isoformat(),
              },
              "generation": {
                  "pythonVersion": "3.12",
                  "encoder": "Pillow",
                  "encoderVersion": PIL.__version__,
                  "exifOrientation": "normalized",
                  "sourceColorConversion": "RGB",
              },
              "derivatives": generated,
          }

          provenance_path = Path("assets/jigsaw/wheat-field-cypresses/provenance.json")
          provenance_path.write_text(json.dumps(provenance, indent=2) + "\n", encoding="utf-8")
          source_path.unlink()
          PY

      - name: Commit finalized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/jigsaw/wheat-field-cypresses assets/jigsaw/wheat-field-cypresses/provenance.json
          git commit -m "Complete Jigsaw artwork provenance"
          git push origin HEAD:codex/jigsaw-first-verified-artwork
