name: Artwork assets

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Existing feature branch that will receive generated artwork
        required: true
        type: string
      asset_ids:
        description: Space- or newline-separated manifest asset IDs
        required: true
        type: string
  issue_comment:
    types:
      - created
  push:
    paths:
      - "assets/jigsaw/**"
      - "public/jigsaw/**"
      - "scripts/ingest_jigsaw_images.py"
      - "scripts/verify_jigsaw_assets.py"
      - ".github/workflows/artwork-assets.yml"
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - "assets/jigsaw/**"
      - "public/jigsaw/**"
      - "scripts/ingest_jigsaw_images.py"
      - "scripts/verify_jigsaw_assets.py"
      - ".github/workflows/artwork-assets.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Verify committed artwork
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install "Pillow==12.3.0"

      - name: Verify committed artwork
        run: python scripts/verify_jigsaw_assets.py --all

  ingest:
    name: Ingest artwork
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.comment.user.login == github.repository_owner &&
        !github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/ingest-artwork ')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: artwork-ingestion
      cancel-in-progress: false

    steps:
      - name: Resolve trusted ingestion request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_REF: ${{ github.ref_name }}
          DISPATCH_TARGET_BRANCH: ${{ inputs.target_branch }}
          DISPATCH_ASSET_IDS: ${{ inputs.asset_ids }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: python
        run: |
          import os
          from pathlib import Path

          event_name = os.environ["EVENT_NAME"]
          if event_name == "workflow_dispatch":
              if os.environ["WORKFLOW_REF"] != os.environ["DEFAULT_BRANCH"]:
                  raise SystemExit("Run this workflow from the default branch only.")
              target_branch = os.environ["DISPATCH_TARGET_BRANCH"].strip()
              asset_ids = os.environ["DISPATCH_ASSET_IDS"].split()
          elif event_name == "issue_comment":
              if os.environ["COMMENT_AUTHOR"] != os.environ["REPOSITORY_OWNER"]:
                  raise SystemExit("Artwork ingestion comments are restricted to the repository owner.")
              tokens = os.environ["COMMENT_BODY"].split()
              if len(tokens) < 3 or tokens[0] != "/ingest-artwork":
                  raise SystemExit(
                      "Usage: /ingest-artwork <target-feature-branch> <asset-id> [asset-id ...]"
                  )
              target_branch = tokens[1]
              asset_ids = tokens[2:]
          else:
              raise SystemExit(f"Unsupported ingestion event: {event_name}")

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as output:
              output.write(f"target_branch={target_branch}\n")
              output.write("asset_ids=" + " ".join(asset_ids) + "\n")

      - name: Checkout target branch
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.request.outputs.target_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install "Pillow==12.3.0"

      - name: Validate target branch
        env:
          TARGET_BRANCH: ${{ steps.request.outputs.target_branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$TARGET_BRANCH" ] || [ "$TARGET_BRANCH" = "$DEFAULT_BRANCH" ] || [ "$TARGET_BRANCH" = "main" ] || [ "$TARGET_BRANCH" = "master" ]; then
            echo "Artwork ingestion requires an explicit non-default feature branch." >&2
            exit 1
          fi
          case "$TARGET_BRANCH" in
            refs/*|origin/*|HEAD)
              echo "Target branch must be a short branch name, not a ref expression." >&2
              exit 1
              ;;
          esac
          if ! git check-ref-format --branch "$TARGET_BRANCH" >/dev/null; then
            echo "Target branch is not a valid Git branch name." >&2
            exit 1
          fi

          CURRENT_BRANCH="$(git branch --show-current)"
          if [ "$CURRENT_BRANCH" != "$TARGET_BRANCH" ]; then
            echo "Checked-out branch does not match the requested target branch." >&2
            exit 1
          fi

          REMOTE_TARGET_SHA="$(git ls-remote --exit-code --heads origin "$TARGET_BRANCH" | awk '{print $1}')"
          if [ -z "$REMOTE_TARGET_SHA" ] || [ "$(git rev-parse HEAD)" != "$REMOTE_TARGET_SHA" ]; then
            echo "Target branch moved or could not be resolved exactly." >&2
            exit 1
          fi

          git fetch origin "$DEFAULT_BRANCH"
          DEFAULT_SHA="$(git rev-parse FETCH_HEAD)"
          if ! git merge-base --is-ancestor "$DEFAULT_SHA" HEAD; then
            echo "Target branch is behind the current default branch." >&2
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "Target checkout must be clean before ingestion." >&2
            exit 1
          fi

      - name: Verify sources and ingest requested artwork
        env:
          ASSET_IDS: ${{ steps.request.outputs.asset_ids }}
        shell: python
        run: |
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          asset_ids = os.environ["ASSET_IDS"].split()
          pattern = re.compile(r"^[a-z0-9]+(?:-[a-z0-9]+)*$")
          if not asset_ids:
              raise SystemExit("At least one asset ID is required.")
          if len(asset_ids) != len(set(asset_ids)):
              raise SystemExit("Duplicate asset IDs are not allowed.")
          invalid = [asset_id for asset_id in asset_ids if not pattern.fullmatch(asset_id)]
          if invalid:
              raise SystemExit(f"Invalid asset IDs: {', '.join(invalid)}")

          manifest = json.loads(Path("assets/jigsaw/sources.json").read_text(encoding="utf-8"))
          known = {entry["assetId"] for entry in manifest["artworks"]}
          unknown = [asset_id for asset_id in asset_ids if asset_id not in known]
          if unknown:
              raise SystemExit(f"Asset IDs are not declared in the manifest: {', '.join(unknown)}")

          subprocess.run(
              [sys.executable, "scripts/ingest_jigsaw_images.py", *asset_ids, "--verify-only"],
              check=True,
          )
          subprocess.run(
              [sys.executable, "scripts/ingest_jigsaw_images.py", *asset_ids],
              check=True,
          )
          subprocess.run(
              [sys.executable, "scripts/verify_jigsaw_assets.py", *asset_ids],
              check=True,
          )

          allowed_paths = {
              *(f"assets/jigsaw/{asset_id}/provenance.json" for asset_id in asset_ids),
              *(
                  f"public/jigsaw/{asset_id}/{name}.webp"
                  for asset_id in asset_ids
                  for name in ("puzzle", "preview", "thumbnail")
              ),
          }
          status = subprocess.run(
              ["git", "status", "--porcelain=v1", "-z", "--untracked-files=all"],
              check=True,
              capture_output=True,
          ).stdout.decode("utf-8").split("\0")
          unexpected = []
          for entry in status:
              if not entry:
                  continue
              if len(entry) < 4 or entry[:2] != "??" or entry[3:] not in allowed_paths:
                  unexpected.append(entry)
          if unexpected:
              raise SystemExit(
                  "Ingestion changed files outside the requested create-only asset outputs: "
                  + repr(unexpected)
              )

          Path(".artwork-ingestion-ids").write_text("\n".join(asset_ids) + "\n", encoding="utf-8")

      - name: Commit generated artwork
        env:
          TARGET_BRANCH: ${{ steps.request.outputs.target_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          while IFS= read -r asset_id; do
            git add -- "assets/jigsaw/$asset_id" "public/jigsaw/$asset_id"
          done < .artwork-ingestion-ids
          rm .artwork-ingestion-ids

          if git diff --cached --quiet; then
            echo "No generated artwork changes found." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Ingest artwork assets"

          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH_HEADER" \
            push "https://github.com/$GITHUB_REPOSITORY.git" "HEAD:$TARGET_BRANCH"
